<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minecraft Bot Control Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- SOL PANEL: BOT OLUŞTURMA & ASMP / LOGIN AYARLARI -->
    <aside class="sidebar">
      <h2>Bot Oluştur</h2>

      <form id="bot-form">
        <div class="form-group">
          <label for="bot-username">Bot Kullanıcı Adı / Nick</label>
          <input type="text" id="bot-username" placeholder="Örn: WorkerBot1" required>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="server-host">Sunucu IP / Host</label>
            <input type="text" id="server-host" placeholder="play.example.com" required>
          </div>
          <div class="form-group flex-1">
            <label for="server-port">Port</label>
            <input type="number" id="server-port" value="25565" required>
          </div>
        </div>

        <div class="form-group">
          <label for="bot-version">Minecraft Sürümü</label>
          <input type="text" id="bot-version" placeholder="Örn: 1.21.11 veya auto">
        </div>

        <!-- ASMP / ROUTER GİRİŞ KOMUTU -->
        <div class="form-group">
          <label for="asmp-cmd">Giriş / ASMP Aktarma Komutu</label>
          <input type="text" id="asmp-cmd" placeholder="Örn: /gir asmp veya /login 123456">
        </div>

        <!-- AUTH / OFFLINE MOD SEÇENEĞİ -->
        <div class="checkbox-group">
          <input type="checkbox" id="auth-offline" checked>
          <label for="auth-offline">Offline Mod (Cracked)</label>
        </div>

        <button type="submit" class="btn btn-add" id="btn-create-bot">
          ➕ Botu Bağlat & Başlat
        </button>
      </form>

      <div class="sidebar-section">
        <h3>Aktif Bot Listesi</h3>
        <div id="active-bots-list" class="active-bots-list">
          <!-- Dinamik olarak aktif botlar listelenir -->
        </div>
      </div>
    </aside>

    <!-- SAĞ PANEL: SEKMELER VE TERMINAL -->
    <main class="main-content">
      
      <!-- BOT SEKMELERİ (TAB BAR) -->
      <div class="tabs-header" id="tabs-header">
        <span class="no-tab-msg" id="no-tab-msg">Aktif bağlı bot bulunmuyor.</span>
      </div>

      <!-- TERMINAL ALANI -->
      <div class="terminal-container">
        
        <!-- ÜST ARAÇ BARI -->
        <div class="terminal-bar">
          <div class="terminal-info">
            <span id="active-bot-title">Seçili Bot: Yok</span>
          </div>
          <div class="terminal-actions">
            <button class="btn btn-clear" id="btn-clear-term">Ekranı Temizle</button>
            <button class="btn btn-danger-sm" id="btn-disconnect-bot">Botu Kapat</button>
          </div>
        </div>

        <!-- TERMINAL ÇIKTI EKRANI -->
        <div class="terminals-wrapper" id="terminals-wrapper">
          <div class="terminal-screen active" id="default-terminal">
            <div class="log-line log-system">[Sistem] Konsol hazır. Sol taraftan bot bilgileri ile giriş yapabilirsiniz.</div>
          </div>
        </div>

        <!-- TERMINAL KOMUT GİRİŞ BARI -->
        <div class="terminal-input-bar">
          <span class="prompt">&gt;</span>
          <input type="text" id="terminal-input" placeholder="Komut yazın (Örn: /gir asmp veya /login pass)..." autocomplete="off">
          <button class="btn btn-send" id="btn-send-cmd">Gönder</button>
        </div>

      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
